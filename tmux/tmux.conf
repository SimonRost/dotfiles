# Minimal tmux configuration for macOS and Linux
#
# Use Ctrl-s as the tmux leader key.
unbind C-b
set -g prefix C-s
bind-key C-s send-prefix

# Improve responsiveness when leaving Neovim insert mode with Escape.
set -sg escape-time 10

# Enable mouse-based pane selection, resizing, scrolling, and window selection.
set -g mouse on

# Retain useful terminal history for logs, test output, and development servers.
set -g history-limit 50000

# Use one-based numbering, which is more natural for interactive use.
set -g base-index 1
setw -g pane-base-index 1

# Renumber remaining windows after one is closed.
set -g renumber-windows on

# Allow applications such as Neovim to receive focus events.
set -g focus-events on

# Copy tmux selections to the terminal clipboard, without allowing applications
# inside tmux to overwrite your clipboard through OSC 52 escape sequences.
set -g set-clipboard external

# Allow image.nvim's Kitty graphics protocol sequences to pass through tmux.
set -g allow-passthrough on

# Vim-style tmux pane navigation.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Resize panes with Vim-style keys in five-cell steps.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Use Vim-style controls in tmux copy mode.
setw -g mode-keys vi

# Copy tmux selections to the macOS clipboard.
# In copy mode: v or Space starts selection; y or Enter copies it.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi Space send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# ---------------------------------------------------------------------------
# Plugins and Catppuccin status bar
# ---------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'

# Match Neovim's Catppuccin Macchiato theme.
set -g @catppuccin_flavour 'macchiato'
set -g @catppuccin_status_background 'none'
set -g @catppuccin_window_status_style 'none'
set -g @catppuccin_pane_status_enabled 'off'
set -g @catppuccin_pane_border_status 'off'

# Place tmux's status bar at the top.
set -g status-position top
set -g status-justify absolute-centre
set -g status-interval 10
set -g status-style 'bg=#{@thm_bg}'

# Left: tmux session, active program, current directory, zoom state.
set -g status-left-length 100
set -g status-left ''
set -ga status-left '#{?client_prefix,#[bg=#{@thm_red}#,fg=#{@thm_bg}#,bold]  #S ,#[bg=#{@thm_bg}#,fg=#{@thm_green}]  #S }'
set -ga status-left '#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│'
set -ga status-left '#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} '
set -ga status-left '#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│'
set -ga status-left '#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$HOME|~|:#{b:pane_current_path}}} '
set -ga status-left '#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]#{?window_zoomed_flag,│,}'
set -ga status-left '#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}'

# Right: battery status and date/time.
set -g status-right-length 100
set -g status-right ''
set -ga status-right '#{?#{e|>=:10,#{battery_percentage}},#[bg=#{@thm_bg},fg=#{@thm_pink}],#[bg=#{@thm_red},fg=#{@thm_bg}]} #{battery_icon} #{battery_percentage} '
set -ga status-right '#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│'
set -ga status-right '#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M '

# Pane borders blend into the status-bar design.
setw -g pane-border-status top
setw -g pane-border-format ''
setw -g pane-active-border-style 'bg=#{@thm_bg},fg=#{@thm_overlay_0}'
setw -g pane-border-style 'bg=#{@thm_bg},fg=#{@thm_surface_0}'
setw -g pane-border-lines single

# Window list in the centre.
set -wg automatic-rename on
set -g automatic-rename-format 'Window'
set -g window-status-format ' #I#{?#{!=:#{window_name},Window},: #W,} '
set -g window-status-style 'bg=#{@thm_bg},fg=#{@thm_rosewater}'
set -g window-status-last-style 'bg=#{@thm_bg},fg=#{@thm_peach}'
set -g window-status-activity-style 'bg=#{@thm_red},fg=#{@thm_bg}'
set -g window-status-bell-style 'bg=#{@thm_red},fg=#{@thm_bg},bold'
set -gF window-status-separator '#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│'
set -g window-status-current-format ' #I#{?#{!=:#{window_name},Window},: #W,} '
set -g window-status-current-style 'bg=#{@thm_peach},fg=#{@thm_bg},bold'

# TPM must load after all plugin declarations.
run '~/.tmux/plugins/tpm/tpm'
